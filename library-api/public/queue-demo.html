<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Queue for Dune</title>
    <link rel="stylesheet" href="/queue-demo.css" />
  </head>
  <body>
    <h1>Queue for <span id="book-title">Dune</span></h1>
    <p>Live: <span id="live">not connected</span></p>

    <form id="login">
      <input id="email" placeholder="email" autocomplete="username" />
      <input id="password" type="password" placeholder="password" autocomplete="current-password" />
      <button id="login-button">Log in</button>
      <p id="login-error"></p>
    </form>

    <div id="who" hidden>
      Logged in as <strong id="name"></strong> (<span id="role"></span>)
      <button id="logout">Log out</button>
    </div>

    <section id="member" hidden>
      <div id="banner" hidden></div>
      <p id="my-status">Loading...</p>
      <button id="join" hidden>Join the queue</button>
      <button id="leave" hidden>Leave the queue</button>
    </section>

    <section id="librarian" hidden>
      <h2>Copies out</h2>
      <ul id="loans"></ul>
      <h2>Queue</h2>
      <ol id="queue"></ol>
      <h2>Desk</h2>
      <ul id="desk"></ul>
    </section>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/queue-demo.js"></script>
  </body>
</html>
