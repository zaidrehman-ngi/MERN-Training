<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Socket test</title>
  </head>
  <body>
    <h1>Socket test</h1>
    <p>Status: <span id="status">connecting...</span></p>
    <p>Online: <span id="online">unknown</span></p>
    <p>
      Watching book: <span id="watching">none</span>
      <input id="book-id" placeholder="bk-1" />
      <button id="watch">Watch this book</button>
    </p>
    <form id="login">
      <input id="email" value="sara.malik@lib.pk" />
      <input id="password" type="password" value="Library@2026" />
      <button>Log in</button>
    </form>
    <form id="form">
      <input id="text" value="Hello from the browser" />
      <button>Send</button>
    </form>
    <button id="no-answer">Send to an event nobody answers</button>
    <p>
      <button class="demo" data-mode="only-me">Send to only me</button>
      <button class="demo" data-mode="everyone">Send to everyone</button>
      <button class="demo" data-mode="everyone-else">Send to everyone else</button>
    </p>
    <p>
      Borrow request (staff only):
      <input id="request-id" placeholder="br-100" />
      <button class="decide" data-status="approved">Approve</button>
      <button class="decide" data-status="rejected">Reject</button>
    </p>
    <ul id="log"></ul>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/socket-test.js"></script>
  </body>
</html>
